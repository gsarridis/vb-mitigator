EXPERIMENT:
  NAME: "george"
  TAG: "dev"
  PROJECT: "waterbirds_baselines"
DATASET:
  TYPE: "waterbirds"
  BIASES: ["background"]
MITIGATOR:
  TYPE: "george"
  GEORGE:
    DISCOVERY_EPOCHS: 50
    CLUSTER_METHOD: "gmm"
    MAX_K: 10
    SEARCH_K: True
    REDUCTION: "umap"
    REDUCTION_COMPONENTS: 2
    ROBUST_STEP_SIZE: 0.01
SOLVER:
  BATCH_SIZE: 64
  EPOCHS: 100
  TYPE: "SGD"
  WEIGHT_DECAY: 1e-4
  SCHEDULER:
    LR_DECAY_STAGES: [1000]
    LR_DECAY_RATE: 0.1
MODEL:
  TYPE: "resnet50"
  PRETRAINED: True
  FREEZE_BACKBONE: False
METRIC: "wg_ovr"