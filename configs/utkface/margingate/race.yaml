EXPERIMENT:
  NAME: "margingate"
  TAG: "race"
  PROJECT: "utkface_baselines"
DATASET:
  TYPE: "utkface"
  BIASES: ["race"]
  UTKFACE:
    BIAS: "race"
MITIGATOR:
  TYPE: "margingate"
  MARGINGATE:
    MARGIN: 0.1         # confidence cutoff
    TEMPERATURE: 0.5      # gate smoothness (smaller -> harder cutoff)
    WARMUP_EPOCHS: 1      # pure CE for the first epoch
    MIN_EFFECTIVE_BATCH: 1.0
    RENORMALIZE: True
SOLVER:
  BATCH_SIZE: 128
  EPOCHS: 100
  LR: 0.001
  TYPE: "Adam"
  WEIGHT_DECAY: 0.0
  SCHEDULER:
    LR_DECAY_STAGES: [60, 80]
    LR_DECAY_RATE: 0.1
MODEL:
  TYPE: "resnet18"
METRIC: "wg_ovr"
