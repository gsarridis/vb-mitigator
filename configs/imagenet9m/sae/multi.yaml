EXPERIMENT:
  NAME: "sae"
  TAG: "multi"
  PROJECT: "imagenet9m_baselines"
DATASET:
  TYPE: "imagenet9m"
  BIASES: ["jpeg", "resize"]
  IMAGENET9M:
    SCENARIO: "multi"
    CLASSES: [0, 1]
    CORRELATION_JPEG: 0.5       # balanced: SAE training + bias-conflict eval
    CORRELATION_RESIZE: 0.5
    JPEG_CLASSES: [[95, "4:4:4"], [75, "4:2:0"]]
    RESIZE_CLASSES: [2.0, 0.5]
MITIGATOR:
  TYPE: "sae"
  SAE:
    MODEL_PATH: "./output/imagenet9m_baselines/multi/erm/best"  # biased ERM (resnet50, multi) to steer
    EXPANSION_FACTOR: 8
    L1_PENALTY: 0.1
    SUP_PENALTY: 1.0
    STEER_ATTRS: []             # [] = steer both jpeg and resize; or e.g. ["resize"]
    HEAD_EPOCHS: 20
    HEAD_LR: 0.001
SOLVER:
  BATCH_SIZE: 256
  EPOCHS: 20
  LR: 0.001
  TYPE: "Adam"
  WEIGHT_DECAY: 0.0
  SCHEDULER:
    TYPE: "None"
MODEL:
  TYPE: "resnet50"
  PRETRAINED: True
METRIC: "sae_steer"
